# Regole di Clean Code (Robert C. Martin) e buone pratiche diffuse.
ruleset: clean-code
title: Clean Code e buone pratiche
version: 1.0.0
source: "Robert C. Martin, Clean Code, Prentice Hall 2008; PEP 8; PEP 257"
rules:
  - id: CC-001
    name: few-arguments
    title: Preferibilmente al massimo 3 argomenti
    scope: function
    metric: parameter_count
    operator: "<="
    threshold: 3
    severity: info
    source: "Clean Code, cap. 3 - Function Arguments"
    rationale: Il numero ideale di argomenti è zero, poi uno, poi due. Tre vanno evitati quando possibile.

  - id: CC-002
    name: no-flag-arguments
    title: Nessun argomento booleano (flag)
    scope: function
    metric: boolean_parameters
    operator: "=="
    threshold: 0
    severity: warning
    languages: [python]
    source: "Clean Code, cap. 3 - Flag Arguments"
    rationale: Un flag dichiara che la funzione fa due cose. Meglio due funzioni.

  - id: CC-003
    name: public-function-docstring
    title: Le funzioni pubbliche hanno una docstring
    scope: function
    metric: has_docstring
    operator: "=="
    threshold: true
    severity: info
    applies_to: public
    languages: [python]
    source: "PEP 257"
    rationale: L'interfaccia pubblica deve dire cosa fa senza obbligare a leggere il corpo.

  - id: CC-004
    name: public-class-docstring
    title: Le classi pubbliche hanno una docstring
    scope: class
    metric: has_docstring
    operator: "=="
    threshold: true
    severity: info
    applies_to: public
    languages: [python]
    source: "PEP 257"
    rationale: Una classe deve dichiarare la propria responsabilità.

  - id: CC-005
    name: no-bare-except
    title: Nessun except generico
    scope: function
    metric: bare_except_count
    operator: "=="
    threshold: 0
    severity: error
    languages: [python]
    source: "Clean Code, cap. 7 - Error Handling; PEP 8"
    rationale: Un except senza tipo nasconde errori imprevisti, compresi KeyboardInterrupt e SystemExit.

  - id: CC-006
    name: few-returns
    title: Al massimo 4 return per funzione
    scope: function
    metric: return_count
    operator: "<="
    threshold: 4
    severity: info
    languages: [python]
    source: "Buona pratica diffusa"
    rationale: Molti punti di uscita rendono difficile seguire il flusso.

  - id: CC-007
    name: class-length
    title: Classe lunga al massimo 300 righe
    scope: class
    metric: length_lines
    operator: "<="
    threshold: 300
    severity: warning
    source: "Clean Code, cap. 10 - Classes Should Be Small"
    rationale: Una classe lunga ha quasi sempre più di una responsabilità.

  - id: CC-008
    name: class-field-count
    title: Classe con al massimo 7 campi
    scope: class
    metric: field_count
    operator: "<="
    threshold: 7
    severity: warning
    languages: [python]
    source: "Clean Code, cap. 10 - Cohesion"
    rationale: Molti campi riducono la coesione e superano la memoria di lavoro.

  - id: CC-009
    name: module-length
    title: Sorgente lungo al massimo 500 righe
    scope: module
    metric: length_lines
    operator: "<="
    threshold: 500
    severity: warning
    source: "Buona pratica diffusa"
    rationale: File corti sono più facili da navigare e da rivedere.

  - id: CC-010
    name: no-todo
    title: Nessun TODO, FIXME o XXX lasciato nel sorgente
    scope: module
    metric: todo_count
    operator: "=="
    threshold: 0
    severity: info
    source: "Clean Code, cap. 4 - TODO Comments"
    rationale: I promemoria nel codice vanno tracciati come attività, non dimenticati nel sorgente.
